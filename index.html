<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<title>Budgetquake</title>
<meta name="description" content="A playable first month of Budgetquake. An eighth grader picks a household, lives its month on its paycheck, and gives a reason for every choice. Runs offline in a browser, in English or Spanish.">
<style>
:root{
  --paper:#f4f2ed;
  --card:#ffffff;
  --ink:#1a1a1a;
  --soft:#53585c;
  --rule:#d8d4cc;
  --edge:#767676;
  --accent:#0b5d3b;
  --red:#9c3418;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:608px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px 0 12px}
.brand{font-size:18px;font-weight:700;line-height:1.25}
.proto{font-size:14px;color:var(--soft);line-height:1.35}
.tools{display:flex;gap:8px}
.tool{min-height:44px;padding:0 14px;border:1px solid var(--ink);border-radius:8px;background:transparent;color:var(--ink);font:inherit;font-size:15px;font-weight:600;cursor:pointer}
.tool[aria-pressed="true"]{background:var(--ink);color:#fff}
@media (max-width:479px){.tools{width:100%}.tools .tool{flex:1 1 0;padding:0 8px}}
.progress{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 16px;font-size:14px;color:var(--soft);padding:0 0 8px}
.progress .bal{display:flex;flex-wrap:wrap;gap:2px 16px}
.progress b{color:var(--ink);font-weight:600}
.progress b.neg{color:var(--red)}
.track{height:3px;background:var(--rule);border-radius:2px;margin:0 0 16px;overflow:hidden}
.track i{display:block;height:100%;background:var(--ink)}
.card{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:24px}
@media (max-width:479px){.card{padding:20px 16px}}
.card:focus,[tabindex="-1"]:focus{outline:none}
.result{font-size:14px;color:var(--soft);margin:0 0 12px;min-height:20px}
h1{font-size:28px;line-height:1.2;margin:0 0 12px}
h2{font-size:22px;line-height:1.25;margin:0 0 8px}
h3{font-size:18px;line-height:1.3;margin:28px 0 8px}
p{margin:0 0 12px}
fieldset{border:0;margin:20px 0 0;padding:0;min-width:0}
legend{font-size:18px;font-weight:600;line-height:1.3;padding:0;margin:0 0 10px}
.choices{display:grid;grid-auto-rows:1fr;gap:10px}
.choice{display:flex;align-items:center;gap:12px;min-height:56px;padding:12px 16px;border:1px solid var(--edge);border-radius:10px;background:#fff;color:var(--ink);cursor:pointer;font-weight:600;line-height:1.3}
.choice input{-webkit-appearance:none;appearance:none;flex:0 0 auto;width:20px;height:20px;margin:0;border:2px solid var(--ink);border-radius:50%;background:#fff;cursor:pointer}
.choice.on{background:var(--ink);border-color:var(--ink);color:#fff}
.choice.on input{border-color:#fff;background:#fff;box-shadow:inset 0 0 0 4px var(--ink)}
.choice:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.choice .txt{flex:1 1 auto;min-width:0}
.choice .amt{flex:0 0 auto;white-space:nowrap}
.hh .txt span{display:block}
.hh .nm{font-size:18px;font-weight:700}
.hh .job{font-weight:400}
.hh .pay{font-weight:600}
.hh .sit{font-weight:400;font-size:15px;color:var(--soft);margin-top:2px}
.hh.on .sit{color:#e9e9e9}
.reason{margin-top:20px}
.reason label{display:block;font-size:16px;font-weight:600;margin:0 0 2px}
.help{font-size:14px;color:var(--soft);margin:0 0 8px}
textarea{display:block;width:100%;min-height:96px;overflow:hidden;padding:10px 12px;border:1px solid var(--edge);border-radius:8px;font:inherit;font-size:16px;color:var(--ink);background:#fff;resize:vertical}
textarea::placeholder{color:#6b6f73}
.hint{font-size:14px;color:var(--red);margin:8px 0 0}
.hint:empty{margin:0}
.btn{display:block;width:100%;min-height:48px;margin-top:16px;padding:10px 16px;border:1px solid var(--ink);border-radius:10px;background:var(--ink);color:#fff;font:inherit;font-size:16px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.btnrow{display:grid;grid-template-columns:1fr;gap:10px;margin-top:24px}
.btnrow .btn{margin-top:0}
@media (min-width:560px){.btnrow{grid-template-columns:1fr 1fr}}
.tool:focus-visible,.btn:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sheet{width:100%;border-collapse:collapse;table-layout:fixed}
.sheet td{padding:8px 0;border-bottom:1px solid var(--rule);vertical-align:top}
.sheet td.n{width:6.5em;text-align:right;white-space:nowrap;font-weight:600;padding-left:12px}
.sheet td .sub{display:block;font-size:14px;color:var(--soft)}
.sheet tr.total td{font-weight:700;border-top:1px solid var(--ink);border-bottom:0}
.neg{color:var(--red)}
.list{list-style:none;margin:0;padding:0}
.list li{padding:12px 0;border-top:1px solid var(--rule)}
.list li:first-child{border-top:0;padding-top:4px}
.list p{margin:0 0 4px}
.flags{list-style:decimal;padding-left:1.4em}
.flags li{padding-left:4px}
.k{font-size:14px;color:var(--soft)}
.said{font-style:italic}
.label{font-weight:600}
details{margin-top:24px;border-top:1px solid var(--rule)}
summary{display:list-item;padding:11px 0;min-height:44px;font-weight:600;cursor:pointer}
.note{font-size:14px;color:var(--soft);margin-top:20px}
footer{font-size:14px;color:var(--soft);padding:20px 0 32px}
footer p{margin:0 0 6px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="brand">Budgetquake</div>
      <div class="proto" id="proto"></div>
    </div>
    <div class="tools">
      <button class="tool" id="langBtn" type="button"></button>
      <button class="tool" id="teachBtn" type="button" aria-pressed="false"></button>
    </div>
  </header>
  <div id="progress"></div>
  <main class="card" id="main" tabindex="-1"></main>
  <footer id="foot"></footer>
</div>
<script>
(function () {
'use strict';

/* Money is whole dollars. A negative amount uses the minus sign. */
function f(n) { return (n < 0 ? '−' : '') + '$' + Math.abs(n).toLocaleString('en-US'); }
function L(en, es) { return { en: en, es: es }; }
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function words(s) { var m = String(s).match(/[\p{L}\p{N}]+/gu); return m ? m.length : 0; }

var OVERDRAFT = 30;

var UI = {
  en: {
    proto: 'Prototype: one month of six',
    lang: 'Español', langAria: 'Ver el juego en español',
    teach: 'Teacher view', back: 'Back to the game',
    privacy: 'Nothing you type is stored or sent. Closing the page clears it.',
    access: 'Runs in the browser on a school Chromebook or a phone, and needs no internet once the page is open.',
    spanish: 'The Spanish text is a prototype of the planned language support.',
    startH: 'Choose a household',
    startLead: 'You get its paycheck and its bills for one month. Every choice asks for one sentence on why, and your teacher reads those reasons.',
    startQ: 'Whose month will you live?',
    takeHome: function (n) { return 'Takes home ' + f(n) + ' a month'; },
    startBtn: 'Start the month',
    pickFirst: 'Choose a household first.',
    step: function (n, t) { return 'Step ' + n + ' of ' + t; },
    checking: 'Checking', savings: 'Savings',
    begins: 'Your month begins.',
    one: 'One sentence is enough.',
    ph: 'I chose this because',
    short: 'A few more words, please. Say what you weighed.',
    cont: 'Continue', seeMonth: 'See the month',
    srcBoth: function (a, b) { return 'You paid ' + f(a) + ' from savings and ' + f(b) + ' from checking.'; },
    srcSav: 'Savings covered all of it.',
    srcChk: 'It came out of checking.',
    over: 'Checking went below zero, and the bank charged a $30 overdraft fee.',
    endH: 'End of month 1',
    stillOwed: 'Still owed',
    lateH: 'Paid late or put off',
    lateNone: 'Nothing was paid late or put off.',
    overItem: function (t) { return 'Checking went below zero (' + t.toLowerCase() + '): $30 overdraft fee'; },
    reasonsH: 'Your reasons',
    ledgerH: 'Every dollar this month',
    left: 'Left from last month', payL: 'Pay after taxes', moved: 'Moved to savings',
    plusSav: function (n) { return 'plus ' + f(n) + ' from savings'; },
    overFee: 'Overdraft fee',
    endChk: 'Checking at the end of the month', endSav: 'Savings at the end of the month',
    next: 'In the full game, five more months follow, then a household you have not met.',
    again: 'Play another household',

    tSoFar: function (n, t) { return n + ' of ' + t + ' decisions made so far.'; },
    tEmpty: 'No month has been played on this device yet. Choose a household and make a choice, and it appears here.',
    tTop3: 'Three to discuss', tTopFew: 'To discuss so far',
    tStep: function (n, t) { return 'Step ' + n + ': ' + t; },
    tChose: 'Chose', tReason: 'Reason', tWhy: 'Why discuss',
    tAll: 'Every decision',
    tNote: 'Prototype. In the full game, a teacher opens a class with a code and sees every student. This view shows only the month played on this device.',
    overNote: 'Checking went below zero here, and the bank charged a $30 overdraft fee.',
    shortNote: 'The reason is short, so ask for more.',
    prepaidToo: 'The phone is also on a smaller data plan.'
  },
  es: {
    proto: 'Prototipo: un mes de seis',
    lang: 'English', langAria: 'Show the game in English',
    teach: 'Vista del docente', back: 'Volver al juego',
    privacy: 'Nada de lo que escribes se guarda ni se envía. Al cerrar la página, se borra todo.',
    access: 'Funciona en el navegador de una Chromebook escolar o de un teléfono, y no necesita internet una vez que la página está abierta.',
    spanish: 'El texto en español es un prototipo del apoyo de idiomas que está planeado.',
    startH: 'Elige un hogar',
    startLead: 'Recibes su sueldo y sus cuentas durante un mes. Cada decisión te pide una oración que explique por qué, y tu docente lee esas razones.',
    startQ: '¿El mes de quién vas a vivir?',
    takeHome: function (n) { return 'Recibe ' + f(n) + ' al mes, ya sin impuestos'; },
    startBtn: 'Empezar el mes',
    pickFirst: 'Primero elige un hogar.',
    step: function (n, t) { return 'Paso ' + n + ' de ' + t; },
    checking: 'Cuenta corriente', savings: 'Ahorros',
    begins: 'Empieza tu mes.',
    one: 'Basta con una oración.',
    ph: 'Elegí esto porque',
    short: 'Unas palabras más, por favor. Di qué tomaste en cuenta.',
    cont: 'Continuar', seeMonth: 'Ver el mes',
    srcBoth: function (a, b) { return 'Pagaste ' + f(a) + ' con tus ahorros y ' + f(b) + ' con la cuenta corriente.'; },
    srcSav: 'Tus ahorros cubrieron todo.',
    srcChk: 'Salió de la cuenta corriente.',
    over: 'La cuenta corriente quedó en negativo, y el banco cobró $30 por sobregiro.',
    endH: 'Fin del mes 1',
    stillOwed: 'Todavía se debe',
    lateH: 'Pagado tarde o aplazado',
    lateNone: 'No se pagó nada tarde ni se aplazó nada.',
    overItem: function (t) { return 'La cuenta corriente quedó en negativo (' + t.toLowerCase() + '): cargo de $30 por sobregiro'; },
    reasonsH: 'Tus razones',
    ledgerH: 'Cada dólar de este mes',
    left: 'Lo que quedó del mes pasado', payL: 'Sueldo sin impuestos', moved: 'Pasado a ahorros',
    plusSav: function (n) { return 'más ' + f(n) + ' de ahorros'; },
    overFee: 'Cargo por sobregiro',
    endChk: 'Cuenta corriente a fin de mes', endSav: 'Ahorros a fin de mes',
    next: 'En el juego completo vienen cinco meses más y después un hogar que no conoces.',
    again: 'Jugar con otro hogar',
    tH: 'Vista del docente',
    tLead: function (name) { return 'Hogar de ' + name + ', mes 1. Cada decisión aparece con la razón que se escribió.'; },
    tSoFar: function (n, t) { return n + ' de ' + t + ' decisiones tomadas hasta ahora.'; },
    tEmpty: 'Todavía no se ha jugado ningún mes en este dispositivo. Elige un hogar y toma una decisión, y aparecerá aquí.',
    tTop3: 'Tres para conversar', tTopFew: 'Para conversar hasta ahora',
    tStep: function (n, t) { return 'Paso ' + n + ': ' + t; },
    tChose: 'Eligió', tReason: 'Razón', tWhy: 'Por qué conversarlo',
    tAll: 'Todas las decisiones',
    tNote: 'Prototipo. En el juego completo, el docente abre una clase con un código y ve a cada estudiante. Esta vista muestra solo el mes jugado en este dispositivo.',
    overNote: 'Aquí la cuenta corriente quedó en negativo, y el banco cobró $30 por sobregiro.',
    shortNote: 'La razón es corta, así que pide que la explique mejor.',
    prepaidToo: 'Además, el teléfono quedó con un plan de menos datos.'
  }
};

/* Card builders. Every figure on a card is computed from the numbers passed in, so the text and the arithmetic cannot drift apart. */
function payday(o) {
  var autoTotal = o.auto.reduce(function (s, x) { return s + x.a; }, 0);
  var avail = o.start + o.pay - autoTotal;
  var a = o.saves[0], b = o.saves[1];
  return {
    kind: 'payday',
    title: L('Payday', 'Día de pago'),
    body: L(
      'Your pay of ' + f(o.pay) + ' lands in checking. You also have ' + f(o.start) + ' left from last month. ' + o.autoEn + ' come out on their own. That is ' + f(autoTotal) + ', so you have ' + f(avail) + ' to plan with.',
      'Tu sueldo de ' + f(o.pay) + ' llega a tu cuenta corriente. También te quedan ' + f(o.start) + ' del mes pasado. ' + o.autoEs + ' se pagan solos. Son ' + f(autoTotal) + ', así que tienes ' + f(avail) + ' para planear.'
    ),
    q: L('How much do you move to savings now?', '¿Cuánto pasas a tus ahorros ahora?'),
    prompt: L('Why this amount?', '¿Por qué esta cantidad?'),
    choices: [
      { label: L('Keep it all in checking for now', 'Dejarlo todo en la cuenta corriente por ahora'), amt: 0, save: 0, tag: 'nosave', w: 2,
        done: L('Nothing moved to savings.', 'No pasaste nada a tus ahorros.'),
        note: L('Nothing was set aside on payday. Ask what a cushion would change when a surprise comes.', 'No se apartó nada el día de pago. Pregunta qué cambiaría un colchón de ahorro cuando llegue un imprevisto.') },
      { label: L('Move ' + f(a) + ' to savings', 'Pasar ' + f(a) + ' a ahorros'), amt: a, save: a, w: 1,
        done: L('You moved ' + f(a) + ' to savings.', 'Pasaste ' + f(a) + ' a tus ahorros.'),
        note: L('Some money was set aside before any bill was paid. Ask how the amount was chosen.', 'Se apartó algo de dinero antes de pagar las cuentas. Pregunta cómo se eligió la cantidad.') },
      { label: L('Move ' + f(b) + ' to savings', 'Pasar ' + f(b) + ' a ahorros'), amt: b, save: b, tag: 'bigsave', w: 1,
        done: L('You moved ' + f(b) + ' to savings.', 'Pasaste ' + f(b) + ' a tus ahorros.'),
        note: L('The largest amount went to savings. Ask whether checking still covered the rest of the month.', 'La cantidad más grande fue a ahorros. Pregunta si la cuenta corriente alcanzó para el resto del mes.') }
    ]
  };
}

function rent(o) {
  return {
    kind: 'bill', item: L('Rent', 'Alquiler'),
    title: L('Rent is due', 'Vence el alquiler'),
    body: L(
      'Rent on your ' + o.homeEn + ' is ' + f(o.rent) + ', due on the 1st. The lease allows five days, then adds a ' + f(o.fee) + ' late fee. The landlord also offers renter’s insurance for ' + f(o.ins) + ' a month.',
      'El alquiler de tu ' + o.homeEs + ' es de ' + f(o.rent) + ' y vence el día 1. El contrato da cinco días de gracia y después cobra un recargo de ' + f(o.fee) + '. El dueño también ofrece un seguro de inquilino por ' + f(o.ins) + ' al mes.'
    ),
    q: L('How do you pay it?', '¿Cómo lo pagas?'),
    prompt: L('Why pay rent this way?', '¿Por qué pagas el alquiler así?'),
    choices: [
      { label: L('Pay the full rent today', 'Pagar todo el alquiler hoy'), amt: o.rent, w: 0,
        done: L('Rent is paid.', 'El alquiler está pagado.'),
        note: L('Rent was paid on time. Ask what else was weighed before paying it.', 'El alquiler se pagó a tiempo. Pregunta qué más se tomó en cuenta antes de pagarlo.') },
      { label: L('Pay it and add renter’s insurance', 'Pagarlo y agregar el seguro de inquilino'), amt: o.rent + o.ins, w: 1,
        done: L('Rent is paid, and your things are insured.', 'El alquiler está pagado y tus cosas tienen seguro.'),
        note: L('Renter’s insurance was added. Ask what it protects and what it costs over a year (' + f(o.ins * 12) + ').', 'Se agregó el seguro de inquilino. Pregunta qué protege y cuánto cuesta en un año (' + f(o.ins * 12) + ').') },
      { label: L('Pay a week late to keep cash on hand', 'Pagar una semana tarde para tener efectivo a mano'), amt: o.rent + o.fee, w: 4,
        late: L('Rent paid a week late: ' + f(o.fee) + ' late fee', 'Alquiler pagado una semana tarde: recargo de ' + f(o.fee)),
        done: L('Rent goes out a week late, with a ' + f(o.fee) + ' late fee.', 'El alquiler sale una semana tarde, con un recargo de ' + f(o.fee) + '.'),
        note: L('Rent was paid late on purpose, for a ' + f(o.fee) + ' fee. Ask what the cash was held for.', 'El alquiler se pagó tarde a propósito, con un recargo de ' + f(o.fee) + '. Pregunta para qué se guardaba el efectivo.') }
    ]
  };
}

function phone(o) {
  var save = o.bill - o.pre;
  return {
    kind: 'bill', item: L('Phone', 'Teléfono'),
    title: L('The phone bill', 'La cuenta del teléfono'),
    body: L(o.bodyEn, o.bodyEs),
    q: L('What do you do with the phone bill?', '¿Qué haces con la cuenta del teléfono?'),
    prompt: L('Why this choice for the phone?', '¿Por qué decidiste esto con el teléfono?'),
    choices: [
      { label: L('Pay the ' + f(o.bill) + ' bill on time', 'Pagar la cuenta de ' + f(o.bill) + ' a tiempo'), amt: o.bill, w: 0,
        done: L('The phone bill is paid.', 'La cuenta del teléfono está pagada.'),
        note: L('The bill was paid on time. Ask whether a cheaper plan was considered.', 'La cuenta se pagó a tiempo. Pregunta si se pensó en un plan más barato.') },
      { label: L(o.preEn, o.preEs), amt: o.pre, tag: 'prepaid', w: 1,
        done: L('You switched to prepaid.', 'Cambiaste a prepagado.'),
        note: L('The cheaper plan saves ' + f(save) + ' a month, ' + f(save * 12) + ' a year. Ask what gets harder with less data.', 'El plan más barato ahorra ' + f(save) + ' al mes, ' + f(save * 12) + ' al año. Pregunta qué se complica con menos datos.') },
      { label: L('Pay next week, with a ' + f(o.fee) + ' late fee', 'Pagar la próxima semana, con un recargo de ' + f(o.fee)), amt: o.bill + o.fee, w: 3,
        late: L('Phone bill paid late: ' + f(o.fee) + ' fee', 'Teléfono pagado tarde: recargo de ' + f(o.fee)),
        done: L('The phone bill goes out late, with a ' + f(o.fee) + ' fee.', 'La cuenta del teléfono sale tarde, con un recargo de ' + f(o.fee) + '.'),
        note: L('A ' + f(o.fee) + ' fee was paid to delay a ' + f(o.bill) + ' bill. Ask what the extra week was for.', 'Se pagó un recargo de ' + f(o.fee) + ' para atrasar una cuenta de ' + f(o.bill) + '. Pregunta para qué servía la semana extra.') }
    ]
  };
}

function utility(o) {
  var total = o.elec + o.net;
  return {
    kind: 'bill', item: L('Electric and internet', 'Luz e internet'),
    title: L('The electric and internet bill', 'La cuenta de luz e internet'),
    body: L(
      'This bill is ' + f(total) + '. Electricity is ' + f(o.elec) + ', and home internet is ' + f(o.net) + '. ' + o.extraEn,
      'Esta cuenta es de ' + f(total) + '. La electricidad cuesta ' + f(o.elec) + ' y el internet en casa, ' + f(o.net) + '. ' + o.extraEs
    ),
    q: L('What do you do with this bill?', '¿Qué haces con esta cuenta?'),
    prompt: L('Why handle the bill this way?', '¿Por qué manejas la cuenta así?'),
    choices: [
      { label: L('Pay the full ' + f(total), 'Pagar los ' + f(total) + ' completos'), amt: total, w: 0,
        done: L('The electric and internet bill is paid.', 'La cuenta de luz e internet está pagada.'),
        note: L('The bill was paid in full. Ask which part of it could change next month.', 'La cuenta se pagó completa. Pregunta qué parte podría cambiar el próximo mes.') },
      { label: L('Cancel the internet and pay ' + f(o.elec) + ' for electricity', 'Cancelar el internet y pagar ' + f(o.elec) + ' de luz'), amt: o.elec, tag: 'cutnet', w: o.cutW,
        done: L('The internet is canceled, and electricity is paid.', 'El internet quedó cancelado y la luz está pagada.'),
        note: L(o.cutNoteEn, o.cutNoteEs) },
      { label: L('Pay next week, with a ' + f(o.fee) + ' late fee', 'Pagar la próxima semana, con un recargo de ' + f(o.fee)), amt: total + o.fee, w: 3,
        late: L('Electric and internet paid late: ' + f(o.fee) + ' fee', 'Luz e internet pagados tarde: recargo de ' + f(o.fee)),
        done: L('The bill goes out late, with a ' + f(o.fee) + ' fee.', 'La cuenta sale tarde, con un recargo de ' + f(o.fee) + '.'),
        note: L('A ' + f(o.fee) + ' fee was paid to delay a ' + f(total) + ' bill. Ask what the extra week was for.', 'Se pagó un recargo de ' + f(o.fee) + ' para atrasar una cuenta de ' + f(total) + '. Pregunta para qué servía la semana extra.') }
    ]
  };
}

function food(o) {
  return {

    if (d.overdraft) { w += 3; extra.push(u.overNote); }
    if (words(d.reason) < 5) { w += 1; extra.push(u.shortNote); }
    return { d: d, ch: ch, card: cardAt(d), w: w, extra: extra };
  }).sort(function (a, b) { return b.w - a.w || a.d.step - b.d.step; });
}

function vStart() {
  var u = UI[S.lang], l = S.lang;
  return '<h1 id="h" tabindex="-1">' + u.startH + '</h1>' +
    '<p>' + u.startLead + '</p>' +
    '<fieldset><legend>' + u.startQ + '</legend><div class="choices">' +
    HH.map(function (h, i) {
      var on = S.pick === i;
      return '<label class="choice hh' + (on ? ' on' : '') + '"><input type="radio" name="hh" value="' + i + '"' + (on ? ' checked' : '') + '>' +
        '<span class="txt"><span class="nm">' + h.name + '</span><span class="job">' + h.job[l] + '</span><span class="pay">' + u.takeHome(h.pay) + '</span><span class="sit">' + h.sit[l] + '</span></span></label>';
    }).join('') +
    '</div></fieldset>' +
    '<p class="hint" id="hint" aria-live="polite">' + esc(S.hint) + '</p>' +
    '<button class="btn" type="button" data-act="start">' + u.startBtn + '</button>';
}

function vCard() {
  var u = UI[S.lang], l = S.lang, h = HH[S.hh], c = h.cards[S.step];
  var last = S.decisions[S.decisions.length - 1];
  var lastCard = S.step === h.cards.length - 1;
  return '<p class="result" role="status">' + esc(last ? resultText(last, l) : u.begins) + '</p>' +
    '<h2 id="h" tabindex="-1">' + c.title[l] + '</h2>' +
    '<p>' + c.body[l] + '</p>' +
    '<fieldset><legend>' + c.q[l] + '</legend><div class="choices">' +
    c.choices.map(function (ch, i) {
      var on = S.sel === i;
      return '<label class="choice' + (on ? ' on' : '') + '"><input type="radio" name="ch" value="' + i + '"' + (on ? ' checked' : '') + '>' +
        '<span class="txt">' + ch.label[l] + '</span>' + (c.kind === 'payday' ? '' : '<span class="amt">' + f(ch.amt) + '</span>') + '</label>';
    }).join('') +
    '</div></fieldset>' +
    '<div class="reason" id="reason"' + (S.sel === null ? ' hidden' : '') + '>' +
    '<label for="why">' + c.prompt[l] + '</label>' +
    '<p class="help" id="whyhelp">' + u.one + '</p>' +
    '<textarea id="why" rows="3" aria-describedby="whyhelp hint" placeholder="' + esc(u.ph) + '">' + esc(S.draft) + '</textarea>' +
    '<p class="hint" id="hint" aria-live="polite">' + esc(S.hint) + '</p>' +
    '<button class="btn" type="button" data-act="next">' + (lastCard ? u.seeMonth : u.cont) + '</button>' +
    '</div>';
}

function lateItems(l) {
  var u = UI[l], out = [];
  S.decisions.forEach(function (d) {
    var ch = choiceAt(d);
    if (ch.late) out.push(ch.late[l]);
    if (ch.putoff) out.push(ch.putoff[l]);
    if (ch.owedText) out.push(ch.owedText[l]);
    if (d.overdraft) out.push(u.overItem(cardAt(d).item[l]));
  });
  return out;
}

function ledger(l) {
  var u = UI[l], h = HH[S.hh], rows = [];
  rows.push([u.left, h.start]);
  rows.push([u.payL, h.pay]);
  h.auto.forEach(function (x) { rows.push([x.t[l], -x.a]); });
  S.decisions.forEach(function (d) {
    var c = cardAt(d);
    if (c.kind === 'payday') { rows.push([u.moved, -d.fromChk]); }
    else { rows.push([c.item[l], -d.fromChk, d.fromSav > 0 ? u.plusSav(d.fromSav) : '']); }
    if (d.overdraft) rows.push([u.overFee, -OVERDRAFT]);
  });
  return '<table class="sheet"><tbody>' +
    rows.map(function (r) {
      return '<tr><td>' + esc(r[0]) + (r[2] ? '<span class="sub">' + esc(r[2]) + '</span>' : '') + '</td><td class="n">' + (r[1] > 0 ? '+' : '') + f(r[1]) + '</td></tr>';
    }).join('') +
    '<tr class="total"><td>' + u.endChk + '</td><td class="n' + (S.checking < 0 ? ' neg' : '') + '">' + f(S.checking) + '</td></tr>' +
    '<tr class="total"><td>' + u.endSav + '</td><td class="n">' + f(S.savings) + '</td></tr>' +
    '</tbody></table>';
}

function vEnd() {
  var u = UI[S.lang], l = S.lang, h = HH[S.hh];
  var last = S.decisions[S.decisions.length - 1];
  var late = lateItems(l);
  return '<p class="result" role="status">' + esc(resultText(last, l)) + '</p>' +
    '<h1 id="h" tabindex="-1">' + u.endH + '</h1>' +
    '<table class="sheet"><tbody>' +
    '<tr><td>' + u.checking + '</td><td class="n' + (S.checking < 0 ? ' neg' : '') + '">' + f(S.checking) + '</td></tr>' +
    '<tr><td>' + u.savings + '</td><td class="n">' + f(S.savings) + '</td></tr>' +
    (S.owed > 0 ? '<tr><td>' + u.stillOwed + '</td><td class="n">' + f(S.owed) + '</td></tr>' : '') +
    '</tbody></table>' +
    '<h3>' + u.lateH + '</h3>' +
    (late.length ? '<ul class="list">' + late.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>' : '<p>' + u.lateNone + '</p>') +
    '<h3>' + u.reasonsH + '</h3>' +
    '<ul class="list">' + S.decisions.map(function (d) {
      var c = cardAt(d), ch = choiceAt(d);
      return '<li><p class="k">' + esc(c.title[l]) + '</p><p class="label">' + esc(ch.label[l]) + '</p><p class="said">“' + esc(d.reason) + '”</p></li>';
    }).join('') + '</ul>' +
    '<details><summary>' + u.ledgerH + '</summary>' + ledger(l) + '</details>' +
    '<p class="note">' + u.next + '</p>' +
    '<div class="btnrow"><button class="btn ghost" type="button" data-act="teach">' + u.teach + '</button><button class="btn" type="button" data-act="again">' + u.again + '</button></div>';
}

function vTeacher() {
  var u = UI[S.lang], l = S.lang;
  if (S.hh === null || !S.decisions.length) {
    return '<h1 id="h" tabindex="-1">' + u.tH + '</h1><p>' + u.tEmpty + '</p><p class="note">' + u.tNote + '</p>' +
      '<button class="btn ghost" type="button" data-act="teach">' + u.back + '</button>';
  }
  var h = HH[S.hh], done = S.screen === 'end', top = ranked(l).slice(0, 3);
  return '<h1 id="h" tabindex="-1">' + u.tH + '</h1>' +
    '<p>' + esc(u.tLead(h.name)) + '</p>' +
    (done ? '' : '<p class="k">' + u.tSoFar(S.decisions.length, h.cards.length) + '</p>') +
    '<h3>' + (done && top.length === 3 ? u.tTop3 : u.tTopFew) + '</h3>' +
    '<ol class="list flags">' + top.map(function (x) {
      return '<li><p class="k">' + esc(u.tStep(x.d.step + 1, x.card.title[l])) + '</p>' +
        '<p><span class="label">' + u.tChose + ':</span> ' + esc(choseText(x.d, l)) + '</p>' +
        '<p><span class="label">' + u.tReason + ':</span> <span class="said">“' + esc(x.d.reason) + '”</span></p>' +
        '<p><span class="label">' + u.tWhy + ':</span> ' + esc([x.ch.note[l]].concat(x.extra).join(' ')) + '</p></li>';
    }).join('') + '</ol>' +
    '<h3>' + u.tAll + '</h3>' +
    '<ul class="list">' + S.decisions.map(function (d) {
      var c = cardAt(d), ch = choiceAt(d);
      return '<li><p class="k">' + esc(u.tStep(d.step + 1, c.title[l])) + '</p><p class="label">' + esc(choseText(d, l)) + '</p><p class="said">“' + esc(d.reason) + '”</p></li>';
    }).join('') + '</ul>' +
    '<p class="note">' + u.tNote + '</p>' +
    '<button class="btn ghost" type="button" data-act="teach">' + u.back + '</button>';
}

function vProgress() {
  if (S.teacher || S.screen !== 'card') return '';
  var u = UI[S.lang], t = HH[S.hh].cards.length;
  return '<div class="progress"><span>' + u.step(S.step + 1, t) + '</span><span class="bal"><span>' + u.checking + ' <b class="' + (S.checking < 0 ? 'neg' : '') + '">' + f(S.checking) + '</b></span><span>' + u.savings + ' <b>' + f(S.savings) + '</b></span></span></div>' +
    '<div class="track" aria-hidden="true"><i style="width:' + ((S.step + 1) / t * 100).toFixed(2) + '%"></i></div>';
}

function render() {
  var u = UI[S.lang];
  document.documentElement.lang = S.lang;
  $('proto').textContent = u.proto;
  var lb = $('langBtn');
  lb.textContent = u.lang;
  lb.setAttribute('lang', S.lang === 'en' ? 'es' : 'en');
  lb.setAttribute('aria-label', u.langAria);
  var tb = $('teachBtn');
  tb.textContent = S.teacher ? u.back : u.teach;
  tb.setAttribute('aria-pressed', S.teacher ? 'true' : 'false');
  $('progress').innerHTML = vProgress();
  main.innerHTML = S.teacher ? vTeacher() : (S.screen === 'start' ? vStart() : S.screen === 'card' ? vCard() : vEnd());
  $('foot').innerHTML = '<p>' + u.privacy + '</p><p>' + u.access + '</p><p>' + u.spanish + '</p>';
  grow();
}

function grow() {
  var ta = $('why');
  if (!ta) return;
  ta.style.height = 'auto';
  ta.style.height = Math.max(96, ta.scrollHeight + 2) + 'px';
}

function toTop() {
  window.scrollTo(0, 0);
  var h = $('h');
  if (h) h.focus({ preventScroll: true });
}

function markOn(input) {
  var all = main.querySelectorAll('input[name="' + input.name + '"]');
  for (var i = 0; i < all.length; i++) all[i].closest('.choice').classList.toggle('on', all[i].checked);
  S.hint = '';
  var hint = $('hint');
  if (hint) hint.textContent = '';
}

var act = {
  start: function () {
    if (S.pick === null) { S.hint = UI[S.lang].pickFirst; $('hint').textContent = S.hint; return; }
    var h = HH[S.pick];
    S.hh = S.pick; S.screen = 'card'; S.step = 0; S.sel = null; S.draft = ''; S.hint = '';
    S.checking = h.start + h.pay - h.autoTotal; S.savings = 0; S.owed = 0; S.decisions = [];
    render(); toTop();
  },
  next: function () {
    var ta = $('why');
    S.draft = ta.value;
    if (words(S.draft) < 3) { S.hint = UI[S.lang].short; $('hint').textContent = S.hint; ta.focus(); return; }
    apply(S.sel, S.draft);
    S.step += 1; S.sel = null; S.draft = ''; S.hint = '';
    if (S.step >= HH[S.hh].cards.length) S.screen = 'end';
    render(); toTop();
  },
  teach: function () { S.teacher = !S.teacher; render(); toTop(); },
  again: function () { S = fresh(S.lang); render(); toTop(); }
};

main.addEventListener('change', function (e) {
  var t = e.target;
  if (t.name === 'hh') { S.pick = +t.value; markOn(t); }
  if (t.name === 'ch') {
    S.sel = +t.value; markOn(t);
    var r = $('reason');
    if (r.hidden) { r.hidden = false; grow(); r.scrollIntoView({ block: 'nearest' }); }
  }
});
main.addEventListener('input', function (e) {
  if (e.target.id === 'why') {
    S.draft = e.target.value;
    grow();
    if (S.hint && words(S.draft) >= 3) { S.hint = ''; $('hint').textContent = ''; }
  }
});
main.addEventListener('keydown', function (e) {
  if (e.target.id === 'why' && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); act.next(); }
});
main.addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]');
  if (b && act[b.dataset.act]) act[b.dataset.act]();
});
$('langBtn').addEventListener('click', function () { S.lang = S.lang === 'en' ? 'es' : 'en'; S.hint = ''; render(); });
$('teachBtn').addEventListener('click', function () { act.teach(); });

render();
})();
</script>
</body>
</html>
